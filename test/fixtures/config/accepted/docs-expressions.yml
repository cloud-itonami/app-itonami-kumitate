# After the CircleCI configuration reference "Using expressions in your
# configuration" and "Expression-based job filters".
version: 2.1
parameters:
  my-custom-param:
    type: string
    default: ""
  run-storybook-tests:
    type: boolean
    default: false
jobs:
  init-service:
    docker: [{image: cimg/base:current}]
    parallelism: << pipeline.git.branch == "main" and 10 or 1 >>
    steps:
      - run:
          name: Print branch info
          command: echo "Running on << pipeline.git.branch or "unknown branch" >>"
  test-service:
    docker: [{image: cimg/base:current}]
    steps: [{run: make test}]
  dry-run-service:
    docker: [{image: cimg/base:current}]
    steps: [{run: make dry-run}]
  publish-service:
    docker: [{image: cimg/base:current}]
    steps: [{run: make publish}]
  deploy-service:
    docker: [{image: cimg/base:current}]
    steps: [{run: make deploy}]
  storybook-tests:
    docker: [{image: cimg/node:20.11}]
    steps: [{run: npm run storybook-test}]
workflows:
  deploy:
    jobs:
      - init-service
      - test-service
      - dry-run-service:
          requires: [init-service]
          filters: pipeline.git.branch != "main" and pipeline.git.branch != "canary"
      - publish-service:
          requires: [init-service, test-service]
          filters: pipeline.git.branch == "main" or pipeline.git.tag starts-with "release"
      - deploy-service:
          context: [org-global]
          requires: [publish-service]
          filters: pipeline.git.branch == "main" and pipeline.parameters.my-custom-param starts-with "DEPLOY:"
      - storybook-tests:
          requires: [init-service]
          filters: |
            pipeline.parameters.run-storybook-tests
            or pipeline.git.branch == "dry-run-deploy"
            or pipeline.git.branch starts-with "deploy"
  tagged:
    when: pipeline.git.tag matches /v[0-9]+(\.[0-9]+)*/ and not (pipeline.git.tag == "v0")
    jobs:
      - publish-service
